[params]
    name = "Faulty Cat Productions || Vincent Giles"
    description = "Melbourne, Victoria. Exploratory music composition, producuction, sound design, and project management, for games, film, new media, installation, and interactivity."
    # email = "hi@faultycat.com.au"


    [params.header]
        title = "Faulty Cat Productions"
        heading = "Vincent Giles"
        subHeading = "Exploratory Music and Sound Design"
        webTag = "together we can build lasting sonic experiences"
        logo = "../logo.svg"

    [params.about]
        title = "Hello! I'm Vincent."
        bio = "I build moving, lasting, exploratory sonic experiences."
        image = "img/general/ec_portrait_2.png"
        image_width = "300px"
        blurb = """
I'm a composer, sound designer, and producer of music, installations, festivals/events, and sound for media. When working with other people, I respond to their needs merging both the technical and creative to create experiences that are lasting and memorable. My clients and creative partners have included Banyule City Council, City of Melbourne, Arts Centre Melbourne, Bio 21 Institute, University of Melbourne, Monash University, Australian Institute of Music and many performers both local and international. I have played in bands around Australia since the mid '00s and collaborated as a performer internationally, and co-founded a small but significant international [experimental music festival](https://web.archive.org/web/20231027011743/https://tilde.net.au/about/).
"""
        blurb_style = "border-right: 3px solid #b89c66; padding-right: 1.5rem;" # Custom CSS
        more_link = "/about"  # URL for the page
        more_text = "Read about my story so far →"  # Link text
        more_style = "display: inline-block; margin-top: 1rem; color:rgb(242, 246, 216);"  # Optional    

    [params.about-full]
        title = "About Vincent & Faulty Cat Productions"
        bio = '''
I work with artists, councils, and galleries to create sound that reveals new layers in its medium – whether for concert halls, games, installations, or public spaces. 

With 20 years of experience in exploratory sound practice – from composing concert works (published by Wirripang, Edition Resonance, and Move Records) to producing ambisonic public art and directing Tilde New Music & Sound Art Inc. – I ensure your project thrives by:

- Drawing on years of education and production experience, guiding and collaborating from concept to post-production, with technical rigour and uncompromising creativity.
- Embracing site specificity and transforming spaces (physical/virtual) through deep understanding of acoustics and conceptual pizzazz.
- Focusing on understanding or building systems to enable a permaculture-informed approach to iteration, monitoring, and project delivery.

I'd love to hear about _your_ ideas and projects to see what I can do to help.
'''
        face_img = "img/giles_promo.jpg"

    [params.contact]
        title = "Connect with me"
        email = "hi@faultycat.com.au"
        instagram_user = "composervince"  # Without @
        instagram_count = 6            # Posts to show

        [[params.contact.social]]
            icon = "instagram"  # icon-key (see below)
            link = "https://instagram.com/composervince"
            name = "Instagram"  # For alt text

        [[params.contact.social]]
            icon = "bandcamp"
            link = "https://vincentgiles.bandcamp.com/"
            name = "Bandcamp"

        # Optional Instagram Feed

        [params.form]
            title = "Let's make something together"
            # Form fields
            name = "Your Name"
            email = "Your Email"
            message = "Tell me about your project"
            buttonText = "Connect"

    [params.footer]
        acknowledgement = """
I live and work on unceded **Wurundjeri Country** in **Pullerbopulloke (Bacchus Marsh)**. I can service the Naarm (Melbourne) areas, and love to collaborate using internet technologies for folks further afield.

As an uninvited guest, I acknowledge the great and ongoing loss of people and knowledge caused by the European colonial project(s).
"""
		FOSS1 = "and hosted such that it reduces environmental impact by serving content on-demand."
		FOSS2 = "As such, users may rarely encounter up to a one-minute delay in access as the servers dynamically power-up for service. The theme is derived from the [hugo artists theme](https://github.com/digitalcraftsman/hugo-artists-theme) with very liberal modification."
		ABN = "ABN: 91 315 232 577"


    [params.services]
        title = "Services I Offer"
        # subtitle = "These are my offerings to the world"

        [[params.services.cards]]
            title = "Composition, Sound Design, and Production"
            image = "../img/services/composition.png"  # Path to image
            description = "I compose original music for instrumentalists and ensembles, games, films. I design sound for installation art, games, film (or suggest something!)"
            link = "/composition"
            link_text = "More information & portfolio →"

        [[params.services.cards]]
            title = "Workshops & Public Speaking" 
            image = "../img/services/workshop.png"
            description = "I offer workshops, mentoring, and public engagement such as speaking panels on public art, sound art, contemporary music."
            link = "/workshops"
            link_text = "See examples →"

        [[params.services.cards]]
            title = "Audio Editing & Post Production"
            image = "../img/services/consulting.jpg"
            description = "I offer audio editing (for example, for podcasts) and post-production, including mixing, along with general consulting services in this space." 
            link = "/post-prod"
            link_text = "Check it out →"

    [params.showreel]
        title = "Showreel"
        subtitle = "Sound and music for exploratory projects."

        # Choose ONE of these:
        vimeo_id = ""  # Just the ID from Vimeo URL
        youtube_id = "" # Just the ID from YouTube URL
        # OR for custom embed:
        custom_embed = '''
<iframe title="blorbs demo" src="https://www.faultycat.com.au/projects/blorbs2/index2.html" width="640" height="360" frameborder="0" allowfullscreen></iframe>
'''
        # SoundCloud section
        soundcloud_playlist = "1383778492"  # Playlist ID from URL
        soundcloud_color = "e0982c"         # Matches your accent color

[outputs]
    home = ["HTML", "RSS"]
    page = ["HTML"]  # Force only HTML for pages
    section = ["HTML"] # Disable XML for sections
    taxonomy = ["HTML"]
    term = ["HTML"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderHooks]
      [markup.goldmark.renderHooks.link]
        enableDefault = true
    [markup.goldmark.renderer]
        unsafe = true
        hardWraps = false

[params.testimonials]
  title = "Testimonials & Reviews"
  subtitle = "What people think of my work."

[markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false